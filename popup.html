<!DOCTYPE html>
<html>
<head>
  <title>YouTube Bookmark</title>
  <link rel="stylesheet" type="text/css" href="common_styles.css">
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <h1>YouTube Bookmarks</h1>

  <div class="action-section">
    <input type="text" id="category-input" placeholder="Enter category (for videos)">
    <div class="action-buttons-group">
      <button id="save-video-button">Save Current Video</button>
      <button id="save-channel-button">Save Current Channel</button>
    </div>
  </div>
  
  <div id="status-message"></div>

  <div class="navigation-section">
    <h2>Manage Saved Items</h2>
    <button id="view-saved-videos" class="nav-button">View Saved Videos</button>
    <button id="view-saved-channels" class="nav-button">View Saved Channels</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
